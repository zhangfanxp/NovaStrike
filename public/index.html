<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>星际突击 Space Strike</title>
    <style>
      :root {
        --bg-dark: #020617;
        --bg-panel: rgba(15, 23, 42, 0.9);
        --line: rgba(34, 211, 238, 0.32);
        --cyan: #22d3ee;
        --blue: #3b82f6;
        --violet: #6366f1;
        --red: #ef4444;
        --green: #22c55e;
        --gold: #facc15;
        --text: #e2e8f0;
        --text-dim: #94a3b8;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: var(--text);
        font-family: "Trebuchet MS", "Noto Sans SC", "PingFang SC", sans-serif;
        background:
          radial-gradient(circle at 15% 20%, rgba(34, 211, 238, 0.08), transparent 48%),
          radial-gradient(circle at 85% 0%, rgba(59, 130, 246, 0.18), transparent 40%),
          linear-gradient(180deg, #020617 0%, #0b1126 100%);
      }

      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #game-root {
        position: absolute;
        inset: 0;
      }

      #game-root canvas {
        display: block;
      }

      .top-bar {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(2, 6, 23, 0.7);
        backdrop-filter: blur(8px);
      }

      .status-pill {
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        color: var(--text-dim);
        font-size: 13px;
      }

      .status-pill.logged {
        color: var(--green);
        border-color: rgba(34, 197, 94, 0.4);
      }

      button {
        border: 0;
        outline: none;
        cursor: pointer;
      }

      .mini-btn {
        height: 34px;
        padding: 0 12px;
        border-radius: 10px;
        color: white;
        border: 1px solid rgba(34, 211, 238, 0.35);
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.15), rgba(99, 102, 241, 0.2));
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .mini-btn:hover {
        transform: translateY(-1px) scale(1.03);
        box-shadow: 0 0 16px rgba(34, 211, 238, 0.25);
      }

      .mini-btn:active {
        transform: scale(0.97);
      }

      .mini-btn.danger {
        border-color: rgba(239, 68, 68, 0.45);
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(190, 24, 93, 0.2));
      }

      .backdrop {
        position: absolute;
        inset: 0;
        z-index: 29;
        background: rgba(2, 6, 23, 0.62);
        backdrop-filter: blur(5px);
      }

      .hidden {
        display: none;
      }

      .modal {
        position: absolute;
        z-index: 30;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(92vw, 480px);
        border-radius: 18px;
        border: 1px solid var(--line);
        background: var(--bg-panel);
        box-shadow: 0 24px 52px rgba(2, 6, 23, 0.7);
        overflow: hidden;
      }

      .modal.wide {
        width: min(94vw, 780px);
      }

      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.22);
      }

      .modal-title {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.08em;
      }

      .close-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        color: var(--text-dim);
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: transparent;
      }

      .modal-body {
        padding: 16px;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }

      .tab-btn {
        height: 40px;
        border-radius: 10px;
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(15, 23, 42, 0.6);
      }

      .tab-btn.active {
        border-color: rgba(34, 211, 238, 0.6);
        background: linear-gradient(135deg, rgba(34, 211, 238, 0.25), rgba(59, 130, 246, 0.28));
      }

      .field {
        margin-bottom: 10px;
      }

      .field label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: var(--text-dim);
      }

      .field input,
      .field select {
        width: 100%;
        height: 42px;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(2, 6, 23, 0.7);
        color: var(--text);
        padding: 0 12px;
      }

      .field input:focus,
      .field select:focus {
        border-color: rgba(34, 211, 238, 0.75);
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .main-btn {
        width: 100%;
        height: 46px;
        border-radius: 12px;
        margin-top: 6px;
        color: white;
        font-size: 16px;
        font-weight: 700;
        border: 1px solid rgba(34, 211, 238, 0.6);
        background: linear-gradient(135deg, #06b6d4, #3b82f6);
        box-shadow: 0 0 24px rgba(34, 211, 238, 0.35);
      }

      .tip {
        margin-top: 10px;
        color: var(--text-dim);
        font-size: 13px;
      }

      .error {
        margin-top: 8px;
        min-height: 20px;
        color: #fda4af;
        font-size: 13px;
      }

      .table-wrap {
        max-height: min(62vh, 430px);
        overflow: auto;
        border-radius: 12px;
        border: 1px solid rgba(148, 163, 184, 0.2);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        padding: 10px 8px;
        text-align: left;
        border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      }

      th {
        position: sticky;
        top: 0;
        background: rgba(2, 6, 23, 0.9);
        z-index: 1;
      }

      tr:nth-child(even) {
        background: rgba(15, 23, 42, 0.4);
      }

      tr.me {
        background: rgba(34, 211, 238, 0.17);
      }

      .rank-1 {
        color: var(--gold);
        font-weight: 700;
      }

      .rank-2 {
        color: #cbd5e1;
        font-weight: 700;
      }

      .rank-3 {
        color: #d97706;
        font-weight: 700;
      }

      .switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .switch-row span {
        color: var(--text-dim);
      }

      .switch-row input[type='checkbox'] {
        width: 20px;
        height: 20px;
        accent-color: #06b6d4;
      }

      .switch-row input[type='range'] {
        width: 160px;
      }

      #toast-area {
        position: absolute;
        z-index: 40;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        pointer-events: none;
      }

      .toast {
        min-width: 220px;
        max-width: 88vw;
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid rgba(148, 163, 184, 0.3);
        background: rgba(2, 6, 23, 0.9);
        color: var(--text);
        box-shadow: 0 10px 24px rgba(2, 6, 23, 0.5);
        animation: pop 0.2s ease;
      }

      .toast.ok {
        border-color: rgba(34, 197, 94, 0.45);
      }

      .toast.err {
        border-color: rgba(239, 68, 68, 0.45);
      }

      @keyframes pop {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @media (max-width: 820px) {
        .top-bar {
          left: 12px;
          right: 12px;
          justify-content: space-between;
          flex-wrap: wrap;
        }

        .field-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-root"></div>

      <div class="top-bar">
        <div id="auth-status" class="status-pill">当前状态: 游客</div>
        <button id="auth-open" class="mini-btn">登录 / 注册</button>
        <button id="auth-logout" class="mini-btn danger hidden">退出登录</button>
      </div>

      <div id="modal-backdrop" class="backdrop hidden"></div>

      <section id="auth-modal" class="modal hidden" aria-modal="true" role="dialog">
        <header class="modal-head">
          <h2 class="modal-title">账户中心</h2>
          <button class="close-btn" data-close-modal="auth-modal">×</button>
        </header>
        <div class="modal-body">
          <div class="tabs">
            <button id="tab-login" class="tab-btn active">登录</button>
            <button id="tab-register" class="tab-btn">注册</button>
          </div>

          <form id="login-form">
            <div class="field">
              <label for="login-account">账号</label>
              <input id="login-account" name="account" maxlength="20" autocomplete="username" required />
            </div>
            <div class="field">
              <label for="login-password">密码</label>
              <input
                id="login-password"
                name="password"
                type="password"
                maxlength="20"
                autocomplete="current-password"
                required
              />
            </div>
            <button class="main-btn" type="submit">登录</button>
          </form>

          <form id="register-form" class="hidden" autocomplete="off">
            <div class="field-row">
              <div class="field">
                <label for="register-account">账号</label>
                <input
                  id="register-account"
                  name="account"
                  maxlength="20"
                  autocomplete="off"
                  autocapitalize="none"
                  spellcheck="false"
                  required
                />
              </div>
              <div class="field">
                <label for="register-nickname">昵称</label>
                <input id="register-nickname" name="nickname" maxlength="12" autocomplete="off" required />
              </div>
            </div>
            <div class="field-row">
              <div class="field">
                <label for="register-password">密码</label>
                <input
                  id="register-password"
                  name="password"
                  type="password"
                  maxlength="20"
                  autocomplete="new-password"
                  autocapitalize="none"
                  autocorrect="off"
                  spellcheck="false"
                  data-lpignore="true"
                  data-1p-ignore="true"
                  required
                />
              </div>
              <div class="field">
                <label for="register-confirm">确认密码</label>
                <input
                  id="register-confirm"
                  name="confirmPassword"
                  type="password"
                  maxlength="20"
                  autocomplete="new-password"
                  autocapitalize="none"
                  autocorrect="off"
                  spellcheck="false"
                  data-lpignore="true"
                  data-1p-ignore="true"
                  required
                />
              </div>
            </div>
            <button class="main-btn" type="submit">注册并登录</button>
          </form>

          <div id="auth-error" class="error"></div>
          <p class="tip">游客可直接开始游戏，登录后可保存成绩并参与排行榜。</p>
        </div>
      </section>

      <section id="panel-modal" class="modal wide hidden" aria-modal="true" role="dialog">
        <header class="modal-head">
          <h2 id="panel-title" class="modal-title">排行榜</h2>
          <button class="close-btn" data-close-modal="panel-modal">×</button>
        </header>
        <div id="panel-body" class="modal-body"></div>
      </section>

      <section id="settings-modal" class="modal hidden" aria-modal="true" role="dialog">
        <header class="modal-head">
          <h2 class="modal-title">设置</h2>
          <button class="close-btn" data-close-modal="settings-modal">×</button>
        </header>
        <div class="modal-body">
          <div class="switch-row">
            <span>背景音乐</span>
            <input id="set-music" type="checkbox" />
          </div>
          <div class="switch-row">
            <span>音效</span>
            <input id="set-sound" type="checkbox" />
          </div>
          <div class="switch-row">
            <span>自动射击</span>
            <input id="set-autofire" type="checkbox" />
          </div>
          <div class="switch-row">
            <span>音量</span>
            <input id="set-volume" type="range" min="0" max="100" step="1" />
          </div>
          <div class="switch-row">
            <span>操作方式</span>
            <select id="set-control">
              <option value="keyboard">键盘</option>
              <option value="mouse">鼠标</option>
            </select>
          </div>
          <button id="save-settings" class="main-btn" type="button">保存设置</button>
          <p class="tip">提示: 当前版本以键盘体验为主，鼠标模式可平滑跟随。</p>
        </div>
      </section>

      <div id="toast-area"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
    <script>
      if (!window.Phaser) {
        const error = document.createElement('div');
        error.style.padding = '18px';
        error.style.color = '#fecaca';
        error.style.background = 'rgba(127,29,29,0.4)';
        error.style.position = 'absolute';
        error.style.top = '16px';
        error.style.left = '16px';
        error.style.border = '1px solid rgba(239,68,68,.5)';
        error.innerText = 'Phaser 加载失败，请检查网络后刷新页面。';
        document.body.appendChild(error);
      }
    </script>
    <script src="./game/main.js"></script>
  </body>
</html>
